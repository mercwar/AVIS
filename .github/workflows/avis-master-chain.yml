# FILE: .github/workflows/avis-master-chain.yml
# IDENTITY: VERSION 2 // GEMINI_CGI_SCROLL // HAHA!
# ROLE: Master Chain - Forge binaries and Dispatch to Surface

name: AVIS_MASTER_CHAIN
on: [push, workflow_dispatch]

jobs:
  forge:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout Root
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm binutils

      - name: FORGE: Compile All ASM
        run: |
          for f in $(find . -maxdepth 2 -name "*.asm"); do
            echo "FORGE: Compiling $f"
            nasm -f elf64 "$f" -o "${f%.asm}.o"
            ld "${f%.asm}.o" -o "${f%.asm}"
            chmod +x "${f%.asm}"
          done

      - name: EXECUTE: Generate V2 Sitemap
        run: |
          if [ -f "SITEMAP.SH" ]; then
            chmod +x SITEMAP.SH
            ./SITEMAP.SH > robots.txt
          fi

      - name: UPLOAD: Store Binaries
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: avis-binaries
          path: |
            ./*
            !./.git

  dispatch:
    runs-on: ubuntu-latest
    needs: forge # Ensures this only runs AFTER forge succeeds
    permissions:
      contents: write
    steps:
      - name: Checkout Root
        uses: actions/checkout@v4

      - name: DOWNLOAD: Retrieve Binaries
        uses: actions/download-artifact@v4
        with:
          name: avis-binaries

      - name: SYNC: Master OS Audit Surface
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "AVIS_V2: Master Chain Dispatch [HAHA!]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to sync."
          fi
