name: AVIS_MASTER_CHAIN

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.txt' # Prevents sitemap updates from re-triggering
  workflow_dispatch:

# Prevents multiple runs from clashing
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout Root
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm binutils

      - name: FORGE: Compile All ASM
        run: |
          find . -maxdepth 2 -name "*.asm" -exec sh -c '
            echo "FORGE: Compiling $1"
            nasm -f elf64 "$1" -o "${1%.asm}.o"
            ld "${1%.asm}.o" -o "${1%.asm}"
            chmod +x "${1%.asm}"
          ' _ {} \;

      - name: EXECUTE: Generate V2 Sitemap
        run: |
          if [ -f "SITEMAP.SH" ]; then
            chmod +x SITEMAP.SH
            ./SITEMAP.SH > robots.txt
          fi

      - name: UPLOAD: Store Binaries
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: avis-binaries
          path: |
            ./*
            !./.git
            !./.github

  dispatch:
    runs-on: ubuntu-latest
    needs: forge
    permissions:
      contents: write
    steps:
      - name: Checkout Root
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essential for pushing back to repo

      - name: DOWNLOAD: Retrieve Binaries
        uses: actions/download-artifact@v4
        with:
          name: avis-binaries

      - name: SYNC: Master OS Audit Surface
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .
          # Check if there are actual changes before committing
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "AVIS_V2: Master Chain Dispatch [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to sync."
          fi
