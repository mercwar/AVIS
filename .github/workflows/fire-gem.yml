name: RUN FIRE-GEM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-firegem:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Vaults
        shell: pwsh
        run: |
          # Create the nested Version 2 hierarchy
          New-Item -Path "VERSION 2\ASM\FORGE\OUT" -ItemType Directory -Force
          New-Item -Path "VERSION 2\ASM\FIRE-GEM\OUT" -ItemType Directory -Force
          New-Item -Path "logs" -ItemType Directory -Force

      - name: Build FIRE-GEM Engine
        shell: pwsh
        run: |
          # Strike the C code into a Windows Executable
          gcc fire-gem.c -o fire-gem.exe
          if ($LASTEXITCODE -ne 0) { Write-Error "FORGE: Compilation Failed" }
          dir fire-gem.exe # Verify existence in logs

      - name: Execute Pulse
        shell: pwsh
        run: |
          # Run the engine and redirect output to the pulse log
          .\fire-gem.exe > logs\fire-gem-pulse.log 2>&1
          Write-Host "FORGE: fire-gem.exe pulse complete."

      - name: Upload AVIS Payload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firegem-v2-package
          path: |
            fire-gem.exe
            logs/
            VERSION 2/ASM/fire-gem.log
            VERSION 2/ASM/FIRE-GEM/OUT/
