name: JOE TRON FORGE
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rebuild-avis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm binutils coreutils

      - name: Forge Master Dispatcher
        run: |
          # Strike fire-gem.asm into a 64-bit binary
          # -f elf64 creates a Linux-compliant object file
          nasm -f elf64 fire-gem.asm -o fire-gem.o
          ld fire-gem.o -o fire-gem.bin
          chmod +x fire-gem.bin
          echo "FORGE: [ACK] fire-gem.bin and fire-gem.o seated."

      - name: Execute AVIS Pulse
        run: |
          mkdir -p ./logs/
          # Execute the dispatcher with zero-buffer to force log flushing
          # stdbuf -o0 ensures every byte hits the log instantly
          stdbuf -o0 -e0 ./fire-gem.bin > ./logs/fire-gem-pulse.log 2>&1
          echo "PULSE: [ACK] Master Dispatcher execution complete."

      - name: Git Dispatch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "AVIS_V2: Master Dispatcher Pulse - Identity Verified [skip ci]"
            git push origin HEAD:main
          else
            echo "AVIS: No changes detected."
          fi

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avis-master-payload
          path: |
            fire-gem.bin
            fire-gem.o
            logs/fire-gem-pulse.log
