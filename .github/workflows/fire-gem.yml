name: RUN FIRE-GEM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-firegem:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Directories
        shell: pwsh
        run: |
          # Create nested directories. -Force prevents errors if they exist.
          New-Item -Path "VERSION 2\ASM\FORGE\OUT" -ItemType Directory -Force
          New-Item -Path "VERSION 2\ASM\FIRE-GEM\OUT" -ItemType Directory -Force
          New-Item -Path "logs" -ItemType Directory -Force

      - name: Build fire-gem Engine
        shell: pwsh
        run: |
          # Compile the main orchestrator first
          gcc fire-gem.c -o fire-gem.exe
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed" }

      - name: Run fire-gem.exe
        shell: pwsh
        run: |
          # Execute and capture output in logs
          .\fire-gem.exe > logs\fire-gem-pulse.log 2>&1
          Write-Host "FORGE: fire-gem.exe executed."

      - name: Upload Logs + Output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firegem-output
          path: |
            logs/
            VERSION 2/ASM/fire-gem.log
            VERSION 2/ASM/FIRE-GEM/OUT/
