name: FIRE-GEM V2 FORGE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------
  # JOB 1 — BUILD FIRE-GEM.EXE
  # ---------------------------------------------------------
  build-firegem:
    runs-on: windows-latest
    outputs:
      exe-path: ${{ steps.build.outputs.exe-path }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build fire-gem.exe
        id: build
        run: |
          gcc fire-gem.c -o fire-gem.exe
          echo "exe-path=fire-gem.exe" >> $env:GITHUB_OUTPUT

      - name: Upload fire-gem.exe
        uses: actions/upload-artifact@v4
        with:
          name: firegem-exe
          path: fire-gem.exe

  # ---------------------------------------------------------
  # JOB 2 — RUN FIRE-GEM.EXE
  # ---------------------------------------------------------
  run-firegem:
    runs-on: windows-latest
    needs: build-firegem

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download fire-gem.exe
        uses: actions/download-artifact@v4
        with:
          name: firegem-exe
          path: .

      - name: Prepare Directories
        run: |
          mkdir "VERSION 2\ASM\FORGE\OUT" -Force
          mkdir "VERSION 2\ASM\FIRE-GEM\OUT" -Force
          mkdir "VERSION 2\ASM" -Force
          mkdir logs -Force

      - name: Run FIRE-GEM
        run: |
          .\fire-gem.exe > logs\fire-gem-pulse.log 2>&1
          echo "FORGE: fire-gem.exe executed."

      - name: Upload Logs + Output
        uses: actions/upload-artifact@v4
        with:
          name: firegem-output
          path: |
            logs/fire-gem-pulse.log
            VERSION 2/ASM/fire-gem.log
            VERSION 2/ASM/FIRE-GEM/OUT/
