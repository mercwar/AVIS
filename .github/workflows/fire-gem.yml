name: JOE TRON FORGE
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  firegem:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Build FIRE-GEM (gcc)
        run: |
          gcc fire-gem.c -o fire-gem.bin
          chmod +x fire-gem.bin
          echo "FORGE: [ACK] fire-gem.bin built."

      - name: Execute FIRE-GEM Forge Core
        run: |
          mkdir -p logs
          ./fire-gem.bin > logs/fire-gem-pulse.log 2>&1
          echo "FORGE: [ACK] fire-gem.bin executed."

      - name: Git Dispatch (Commit Forge Output)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "AVIS_V2: FIRE-GEM Forge Output [skip ci]"
            git push origin HEAD:main
          else
            echo "AVIS: No changes detected."
          fi

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firegem-payload
          path: |
            fire-gem.bin
            logs/fire-gem-pulse.log
            AVIS/VERSION 2/ASM/fire-gem.log
            AVIS/VERSION 2/ASM/FIRE-GEM/OUT/
