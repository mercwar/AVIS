name: AVIS-V2-FIRE-GEM-FORGE
on:
  push:
    paths:
      - "AVIS/VERSION 2/FORGE/*.asm"
  workflow_dispatch:

jobs:
  forge-v2:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout AVIS Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils gcc

      - name: Build FIRE-GEM Forge Core
        run: |
          nasm -f elf64 "AVIS/VERSION 2/fire-gem.asm" -o fire-gem.o
          gcc fire-gem.o -o fire-gem

      - name: Run FIRE-GEM Forge Core
        run: |
          echo "[AVIS_V2] EXEC: Running fire-gem.exe FORGE ENGINE..."
          ./fire-gem

      - name: Sync Forge Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "AVIS_V2: Forge Output Sync [skip ci]"
            git push origin HEAD:main
          else
            echo "[AVIS_V2] No changes detected."
          fi
