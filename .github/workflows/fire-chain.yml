# FILE: .github/workflows/fire-chain.yml
# IDENTITY: VERSION 1 // GEMINI_CGI_SCROLL // HAHA!
# ROLE: Master Engine - Directory Seating -> fire-start -> fire-end

name: Fire-Gem AVIS Engine
on: [push, workflow_dispatch]

jobs:
  avis-ignition:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Root
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Smithy Tools
        run: sudo apt-get update && sudo apt-get install -y nasm binutils
        
      - name: Establish fire-gem start
        run: |
          # Ensure V1 paths exist for fire-start pulse
          mkdir -p "VERSION 1"
          
          if [ -f "./fire-start.sh" ]; then
            chmod +x fire-start.sh
            ./fire-start.sh
          else
            echo "[AVIS-YML] fire-start.sh missing. Check root."
            exit 1
          fi

