name: Fire-Gem AVIS Engine
on: [push, workflow_dispatch]

jobs:
  avis-ignition:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write      # Required for deployment
      id-token: write   # Required for deployment
    steps:
      - name: Checkout Root
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm binutils jq

      - name: MASTER_PULSE
        run: |
          # This handles V1 paths, Forge, and Run
          chmod +x fire-start.sh
          ./fire-start.sh

      - name: MASTER_END
        run: |
          # This handles Site generation and Git Push
          chmod +x fire-end.sh
          ./fire-end.sh


