# FILE: .github/workflows/avis-master-chain.yml
# IDENTITY: VERSION 2 // GEMINI_CGI_SCROLL // HAHA! FIXED!
name: FIRE-SITE
on: [push, workflow_dispatch]

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Root
        uses: actions/checkout@v4

      - name: EXECUTE: Generate V2 Sitemap
        run: |
          if [ -f "SITEMAP.SH" ]; then
            chmod +x SITEMAP.SH
            ./SITEMAP.SH > sitemap.xml
            # Create/Update robots.txt to point to the new sitemap
            echo "User-agent: *" > robots.txt
            echo "Sitemap: https://${{ github.repository_owner }.github.io/${{ github.event.repository.name }}/sitemap.xml" >> robots.txt
          fi

      - name: UPLOAD: Store Binaries
        uses: actions/upload-artifact@v4
        with:
          name: avis-binaries
          path: |
            sitemap.xml
            robots.txt
            ./*
            !./.git

  dispatch:
    runs-on: ubuntu-latest
    needs: forge
    permissions:
      contents: write
    steps:
      - name: Checkout Root
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensures rebase works correctly

      - name: DOWNLOAD: Retrieve Binaries
        uses: actions/download-artifact@v4
        with:
          name: avis-binaries
          path: . # Download directly into root to overwrite/add

      - name: SYNC: Master OS Audit Surface
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          
          git add sitemap.xml robots.txt
          # Add other binaries if needed
          git add . 

          if ! git diff --staged --quiet; then
            git commit -m "AVIS_V2: Master Chain Dispatch [Sitemap Fixed]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          else
            echo "No changes to sync."
          fi
