# FILE: .github/workflows/fire-site.yml
# IDENTITY: VERSION 3 // FIRE-SITE // AVIS-PURE

name: FIRE-SITE

on:
  push:
  workflow_dispatch:

jobs:
  publish-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: CHECKOUT: Pull Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: EXECUTE: Generate Sitemap + Robots
        run: |
          if [ -f "SITEMAP.SH" ]; then
            chmod +x SITEMAP.SH
            ./SITEMAP.SH > sitemap.xml

            echo "User-agent: *" > robots.txt
            echo "Sitemap: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/sitemap.xml" >> robots.txt
          else
            echo "ERROR: SITEMAP.SH not found"
            exit 1
          fi

      - name: COMMIT + PUSH: Deploy FIRE-SITE
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"

          git add sitemap.xml robots.txt

          if ! git diff --staged --quiet; then
            git commit -m "FIRE-SITE: Sitemap Updated"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}"
          else
            echo "No changes to push."
          fi
