# FILE: .github/workflows/avis-master-chain.yml
# IDENTITY: VERSION 2 // GEMINI_CGI_SCROLL

name: FIRE-SITE

on:
  push:
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Root
        uses: actions/checkout@v4

      - name: EXECUTE: Generate V2 Sitemap
        run: |
          if [ -f "SITEMAP.SH" ]; then
            chmod +x SITEMAP.SH
            ./SITEMAP.SH > sitemap.xml

            # Create/Update robots.txt to point to the new sitemap
            echo "User-agent: *" > robots.txt
            echo "Sitemap: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/sitemap.xml" >> robots.txt
          fi

      - name: UPLOAD: Store Binaries
        uses: actions/upload-artifact@v4
        with:
          name: avis-binaries
          path: |
            sitemap.xml
            robots.txt

  dispatch:
    runs-on: ubuntu-latest
    needs: forge
    permissions:
      contents: write

    steps:
      - name: Checkout Root
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DOWNLOAD: Retrieve Binaries
        uses: actions/download-artifact@v4
        with:
          name: avis-binaries
          path: .

      - name: SYNC: Master OS Audit Surface
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"

          git add sitemap.xml robots.txt

          if ! git diff --staged --quiet; then
            git commit -m "AVIS_V2: Master Chain Dispatch [Sitemap Fixed]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}"
          else
            echo "No changes to sync."
          fi
