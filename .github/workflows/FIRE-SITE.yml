# FILE: .github/workflows/fire-site.yml
# IDENTITY: FIRE-SITE // AVIS-PUBLISH

name: FIRE-SITE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/sitemap.xml

    steps:
      - name: CHECKOUT: Pull Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: EXECUTE: Generate Sitemap + Robots
        run: |
          if [ ! -f "SITEMAP.SH" ]; then
            echo "ERROR: SITEMAP.SH not found"
            exit 1
          fi

          chmod +x SITEMAP.SH
          ./SITEMAP.SH > sitemap.xml

          echo "User-agent: *" > robots.txt
          echo "Sitemap: ${SITE_URL}" >> robots.txt

      - name: COMMIT + PUSH: Deploy FIRE-SITE
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"

          git add sitemap.xml robots.txt

          if ! git diff --staged --quiet; then
            git commit -m "FIRE-SITE: Sitemap Updated"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}"
          else
            echo "No changes to push."
          fi
