name: JOE TRON FORGE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  forge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm binutils coreutils
      - name: Global Forge Cycle
        run: |
          # 1. Strike all .asm into .bin and preserve .o identity
          find . -maxdepth 2 -name "*.asm" | while read -r f; do
            OBJ="${f%.asm}.o"
            BIN="${f%.asm}.bin"
            nasm -f elf64 "$f" -o "$OBJ"
            ld "$OBJ" -o "$BIN"
            chmod +x "$BIN"
          done
      - name: Execute Pulse
        run: |
          # 2. Force zero-buffer execution for all shell workers
          find . -maxdepth 2 -name "*.sh" -not -path "*/.*" | while read -r sh_file; do
            chmod +x "$sh_file"
            stdbuf -o0 -e0 "$sh_file"
          done
      - name: Sync Dispatch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "AVIS_V2: Object Identity & Log Flush [skip ci]" || echo "No changes"
          git push origin HEAD:main
