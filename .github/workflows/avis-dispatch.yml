# FILE: .github/workflows/avis-dispatch.yml
# IDENTITY: VERSION 2 // GEMINI_CGI_SCROLL // HAHA!
# ROLE: Final Server Synchronization and Push

name: AVIS_DISPATCH_CHAIN
on:
  workflow_run:
    workflows: ["AVIS_FORGE_CHAIN"]
    types:
      - completed

jobs:
  sync-to-main:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: DOWNLOAD FORGED ARTIFACTS
        uses: actions/download-artifact@v4
        with:
          name: avis-binaries

      - name: FINAL SERVER SYNC
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          
          # Stage all generated robots.txt, sitemaps, and binaries
          git add .
          
          if ! git diff --staged --quiet; then
            git commit -m "AVIS_V2: Chain Dispatch Verified [HAHA!]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected in the chain."
          fi
