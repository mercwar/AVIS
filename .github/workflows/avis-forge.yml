# FILE: .github/workflows/avis-forge.yml
# IDENTITY: VERSION 2.1 // GEMINI_CGI_SCROLL // FIXED COLLISION // HAHA!
# ROLE: Autonomous Discovery and Compilation Engine

name: AVIS_FORGE_CHAIN
on: [push, workflow_dispatch]

jobs:
  forge-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Root
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm binutils

      - name: DISCOVER AND FORGE ASM
        run: |
          # Use a .bin suffix to avoid crashing on directories like ./fire-gem
          find . -maxdepth 2 -name "*.asm" | while read -r f; do
            OUT="${f%.asm}.bin"
            echo "FORGE: Compiling $f -> $OUT"
            nasm -f elf64 "$f" -o "${f%.asm}.o"
            ld "${f%.asm}.o" -o "$OUT"
            chmod +x "$OUT"
            rm "${f%.asm}.o" # Clean up object files
          done

      - name: DISCOVER AND TEST SHELLS
        run: |
          # Run SITEMAP.SH or fire-gem.sh to prepare artifacts
          # Note: Added -type f to ensure we don't try to chmod/exec directories
          find . -maxdepth 2 -name "*.sh" -type f -exec chmod +x {} \; -exec {} \;

      - name: UPLOAD ARTIFACTS FOR DISPATCH
        uses: actions/upload-artifact@v4
        with:
          name: avis-binaries
          path: |
            ./*.bin
            ./*.sh
            ./robots.txt
            !./.git
