name: AVIS_FORGE_CHAIN

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm binutils

      - name: Forge
        run: |
          find . -maxdepth 2 -name "*.asm" | while read -r f; do
            OUT="${f%.asm}.bin"
            echo "Compiling $f"
            nasm -f elf64 "$f" -o "${f%.asm}.o"
            ld "${f%.asm}.o" -o "$OUT"
            chmod +x "$OUT"
            rm -f "${f%.asm}.o"
          done

      - name: Shells
        run: |
          find . -maxdepth 2 -name "*.sh" -type f -exec chmod +x {} \; -exec {} \;

      - name: Sync
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "AVIS_V2: Dispatch [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes"
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: avis-binaries
          path: |
            *.bin
            *.sh
            robots.txt

