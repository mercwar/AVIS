# FILE: .github/workflows/avis-forge.yml
# IDENTITY: VERSION 2 // GEMINI_CGI_SCROLL // HAHA!
# ROLE: Autonomous Discovery and Compilation Engine

name: AVIS_FORGE_CHAIN
on: [push, workflow_dispatch]

jobs:
  forge-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Root
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm binutils

      - name: DISCOVER AND FORGE ASM
        run: |
          # Find all .asm files and compile them
          for f in $(find . -maxdepth 2 -name "*.asm"); do
            echo "FORGE: Compiling $f"
            nasm -f elf64 "$f" -o "${f%.asm}.o"
            ld "${f%.asm}.o" -o "${f%.asm}"
            chmod +x "${f%.asm}"
          done

      - name: DISCOVER AND TEST SHELLS
        run: |
          # Run SITEMAP.SH or fire-gem.sh to prepare artifacts
          find . -maxdepth 2 -name "*.sh" -exec chmod +x {} \; -exec {} \;

      - name: UPLOAD ARTIFACTS FOR DISPATCH
        uses: actions/upload-artifact@v4
        with:
          name: avis-binaries
          path: |
            ./*
            !./.git
