name: JOE TRON FORGE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  forge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm binutils
      - name: Forge
        run: |
          find . -maxdepth 2 -name "*.asm" | while read -r f; do
            OUT="${f%.asm}.bin"
            nasm -f elf64 "$f" -o "${f%.asm}.o"
            ld "${f%.asm}.o" -o "$OUT"
            chmod +x "$OUT"
          done
      - name: Shells
        run: find . -maxdepth 2 -name "*.sh" -exec chmod +x {} \; -exec {} \;
      - name: Sync
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "AVIS_V2: Dispatch [skip ci]" || echo "No changes"
          git push origin HEAD:main
